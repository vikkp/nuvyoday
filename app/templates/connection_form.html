{% extends "base.html" %}

{% block title %}{% if connection %}Edit{% else %}New{% endif %} Connection — Nuvyoday{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white">
        <h4 class="mb-0">
          {% if connection %}
            <i class="bi bi-pencil"></i> Edit Connection
          {% else %}
            <i class="bi bi-plus-lg"></i> New IBM i Connection
          {% endif %}
        </h4>
      </div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Display Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required
                   value="{{ connection.name if connection else '' }}"
                   placeholder="e.g. Production, Seggu UAT, Francisco’s system">
          </div>

          <div class="row">
            <div class="col-md-8 mb-3">
              <label class="form-label">Host / IP <span class="text-danger">*</span></label>
              <input type="text" name="host" class="form-control" required
                     value="{{ connection.host if connection else '' }}"
                     placeholder="myibmi.company.com or 10.x.x.x">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Port</label>
              <input type="number" name="port" class="form-control"
                     value="{{ connection.port if connection else 8473 }}">
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Username <span class="text-danger">*</span></label>
              <input type="text" name="username" class="form-control" required
                     value="{{ connection.username if connection else '' }}"
                     autocomplete="username">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">
                Password {% if not connection %}<span class="text-danger">*</span>{% endif %}
              </label>
              <input type="password" name="password" class="form-control"
                     {% if not connection %}required{% endif %}
                     placeholder="{% if connection %}Leave blank to keep current{% else %}IBM i password{% endif %}"
                     autocomplete="current-password">
            </div>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="use_ssl" id="use_ssl"
                   {% if connection and connection.use_ssl %}checked{% endif %}>
            <label class="form-check-label" for="use_ssl">Use SSL / TLS</label>
          </div>

          <div class="mb-3">
            <label class="form-label">Preferred Libraries (optional)</label>
            <input type="text" name="libraries" class="form-control"
                   value="{{ connection.libraries if connection else '' }}"
                   placeholder="e.g. PRODLIB, CUSTLIB, QGPL (comma separated)">
            <div class="form-text">Used later for focused inventory and harvesting.</div>
          </div>

          <div class="mb-4">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="2"
                      placeholder="Any useful context…">{{ connection.notes if connection else '' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              {% if connection %}Save Changes{% else %}Create Connection{% endif %}
            </button>
            <a href="{{ url_for('main.connections_list') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
